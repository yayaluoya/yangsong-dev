<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>向量画板</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      background: #f5f5f5;
      color: #333;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .canvas-wrap {
      flex: 1;
      background: #fff;
      overflow: hidden;
      min-height: 0;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    .info-bar {
      flex-shrink: 0;
      background: #fff;
      padding: 6px 16px;
      font-size: 12px;
      color: #9b59b6;
      border-top: 1px solid #eee;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
    }

    .info-table td {
      width: 50%;
      text-align: left;
      padding: 1px 0;
    }

    .vl {
      color: #f39c12;
      font-weight: 700;
      font-size: 13px;
    }

    .controls {
      flex-shrink: 0;
      background: #fff;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid #eee;
    }

    .group {
      background: #f8f8f8;
      border-radius: 10px;
      padding: 10px 12px;
    }

    .group-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .field {
      flex: 1;
    }

    .field label {
      display: block;
      font-size: 10px;
      color: #999;
      margin-bottom: 2px;
    }

    .field input {
      width: 100%;
      padding: 6px 8px;
      font-size: 14px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      outline: none;
      -webkit-appearance: none;
      background: #fff;
    }

    .field input:focus {
      border-color: #667eea;
    }

    .btn-calc {
      flex: 1;
      padding: 8px;
      font-size: 12px;
      border: none;
      background: #f8f8f8;
      color: #9b59b6;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-calc:active {
      background: #f3eef8;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }

    .modal-box {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      font-size: 13px;
      line-height: 1.8;
    }
    .modal-body {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .modal-box h3 {
      position: sticky;
      top: 0;
      background: #fff;
      margin: 0 0 12px 0;
      padding-bottom: 8px;
      color: #9b59b6;
      z-index: 1;
    }
    .modal-box .step {
      margin-bottom: 8px;
    }
    .modal-box .step-title {
      font-weight: 600;
      color: #333;
    }
    .modal-box .step-val {
      color: #666;
    }
    .modal-close {
      float: right;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #999;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div class="info-bar" id="infoBar"></div>

  <div class="controls">
    <div class="group">
      <div class="group-title">
        <span class="dot" style="background:#e74c3c;"></span> 第一次
      </div>
      <div class="row">
        <div class="field">
          <label>振动 (IPs)</label>
          <input type="number" id="valA" value="0.5" step="0.01" min="0">
        </div>
        <div class="field">
          <label>角度 (0~360°)</label>
          <input type="number" id="angA" value="90" step="0.1" min="0" max="360">
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-title">
        <span class="dot" style="background:#2ecc71;"></span> 第二次
      </div>
      <div class="row">
        <div class="field">
          <label>振动 (IPs)</label>
          <input type="number" id="valB" value="0.7" step="0.01" min="0">
        </div>
        <div class="field">
          <label>角度 (0~360°)</label>
          <input type="number" id="angB" value="120" step="0.1" min="0" max="360">
        </div>
        <div class="field">
          <label>克数</label>
          <input type="number" id="gramsB" value="0" step="1" min="0">
        </div>
      </div>
    </div>

    <div class="row">
      <button class="btn-calc" onclick="resetView()">重置视图</button>
      <button class="btn-calc" onclick="showCalc()">查看计算过程</button>
      <button class="btn-calc" onclick="showSettings()">设置</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeCalc(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>计算过程 <button class="modal-close" onclick="closeCalc()">✕</button></h3>
      <div class="modal-body"><div id="modalContent"></div></div>
    </div>
  </div>

  <div class="modal-overlay" id="settingsOverlay" onclick="closeSettings(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>设置 <button class="modal-close" onclick="closeSettings()">✕</button></h3>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px;">
        <div class="group">
          <div class="group-title">
            <span class="dot" style="background:#667eea;"></span> 显示范围
          </div>
          <div class="row">
            <div class="field">
              <label>坐标轴最大刻度（半径）</label>
              <input type="number" id="rangeMax" value="1" step="0.1" min="0.1">
            </div>
          </div>
        </div>

        <div class="group">
          <div class="group-title">
            <span class="dot" style="background:#f39c12;"></span> V组颜色
          </div>
          <div class="row">
            <div class="field"><label>V</label><input type="color" id="colorV" value="#f39c12"></div>
            <div class="field"><label>V1</label><input type="color" id="colorV1" value="#fad7a0"></div>
            <div class="field"><label>V2</label><input type="color" id="colorV2" value="#fad7a0"></div>
            <div class="field"><label>V3</label><input type="color" id="colorV3" value="#f39c12"></div>
            <div class="field"><label>V4</label><input type="color" id="colorV4" value="#f39c12"></div>
          </div>
        </div>

        <div style="text-align:center;font-size:10px;color:#ccc;padding-top:4px;">v1.1.0</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const inputValA = document.getElementById('valA');
    const inputAngA = document.getElementById('angA');
    const inputValB = document.getElementById('valB');
    const inputAngB = document.getElementById('angB');
    const inputGramsB = document.getElementById('gramsB');
    const inputColorV = document.getElementById('colorV');
    const inputColorV1 = document.getElementById('colorV1');
    const inputColorV2 = document.getElementById('colorV2');
    const inputColorV3 = document.getElementById('colorV3');
    const inputColorV4 = document.getElementById('colorV4');
    const inputRangeMax = document.getElementById('rangeMax');

    const dpr = window.devicePixelRatio || 1;

    // 视图变换状态：平移偏移（物理像素）与缩放系数
    let offsetX = 0, offsetY = 0, zoom = 1;

    // 文字标注（标签/数值）统一收集，最后在最上层绘制
    let labels = [];

    function resize() {
      const wrap = canvas.parentElement;
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      draw();
    }

    function degToRad(deg) {
      return (deg * Math.PI) / 180;
    }

    function fmtTick(v) {
      const r = Math.round(v * 100) / 100;
      return String(r);
    }

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2 + offsetX;
      const cy = h / 2 + offsetY;
      const rangeMax = Math.max(0.1, parseFloat(inputRangeMax.value) || 1);
      const scale = (Math.min(w, h) / 2) / (rangeMax * 1.2) * zoom;

      ctx.clearRect(0, 0, w, h);
      labels = [];

      // 坐标轴
      ctx.strokeStyle = '#ddd';
      ctx.lineWidth = 1 * dpr;
      ctx.beginPath();
      ctx.moveTo(cx, 0);
      ctx.lineTo(cx, h);
      ctx.moveTo(0, cy);
      ctx.lineTo(w, cy);
      ctx.stroke();

      // 刻度标记
      ctx.fillStyle = '#ccc';
      ctx.font = `${10 * dpr}px sans-serif`;
      ctx.textAlign = 'center';
      const segs = 5;
      const step = (rangeMax * scale) / segs;
      for (let i = 1; i <= segs; i++) {
        const r = step * i;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = '#f0f0f0';
        ctx.stroke();
        ctx.fillText(fmtTick(r / scale), cx + r, cy + 14 * dpr);
      }

      // 箭头
      ctx.fillStyle = '#999';
      ctx.beginPath();
      ctx.moveTo(w, cy);
      ctx.lineTo(w - 8 * dpr, cy - 4 * dpr);
      ctx.lineTo(w - 8 * dpr, cy + 4 * dpr);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx, 0);
      ctx.lineTo(cx - 4 * dpr, 8 * dpr);
      ctx.lineTo(cx + 4 * dpr, 8 * dpr);
      ctx.fill();

      // 原点标记
      ctx.fillStyle = '#999';
      ctx.fillText('O', cx - 10 * dpr, cy + 14 * dpr);

      // 计算端点
      const a = getEndpoint(inputValA.value, inputAngA.value, scale, cx, cy);
      const b = getEndpoint(inputValB.value, inputAngB.value, scale, cx, cy);

      // 画向量 A
      drawVector(cx, cy, a.x, a.y, '#e74c3c', '第一次', parseFloat(inputValA.value) || 0, parseFloat(inputAngA.value) || 0, 1.5);
      // 画向量 B
      drawVector(cx, cy, b.x, b.y, '#2ecc71', '第二次', parseFloat(inputValB.value) || 0, parseFloat(inputAngB.value) || 0, 1.5);
      // 虚线连接 A 末端到 B 末端，展示几何关系
      const diffLen = Math.sqrt((b.x - a.x) ** 2 + (b.y - a.y) ** 2) / scale;
      const diffAng = Math.atan2(-(b.y - a.y), b.x - a.x) * 180 / Math.PI;

      ctx.strokeStyle = '#bbb';
      ctx.lineWidth = 1.5 * dpr;
      ctx.setLineDash([5 * dpr, 5 * dpr]);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // B−A 从原点画出
      const diffEndX = cx + (b.x - a.x);
      const diffEndY = cy + (b.y - a.y);
      drawVector(cx, cy, diffEndX, diffEndY, inputColorV.value, 'V', diffLen, diffAng, 3);

      // A 的反向量（虚线）
      const valA = parseFloat(inputValA.value) || 0;
      const angA = parseFloat(inputAngA.value) || 0;
      const negAng = ((angA + 180) % 360 + 360) % 360;
      const negRad = degToRad(negAng);
      const negX = cx + valA * Math.cos(negRad) * scale;
      const negY = cy - valA * Math.sin(negRad) * scale;
      ctx.setLineDash([6 * dpr, 4 * dpr]);
      drawVector(cx, cy, negX, negY, '#e74c3c', '反向第一次', valA, negAng, 1.5);
      ctx.setLineDash([]);

      // 构建 V, V1~V4 向量列表，归一化角度到 [0, 360)
      const allV = [];
      // V
      allV.push({
        ang: ((diffAng % 360) + 360) % 360,
        ex: diffEndX, ey: diffEndY,
        color: inputColorV.value, label: 'V'
      });
      // V1~V4
      const vColors = [null, inputColorV1.value, inputColorV2.value, inputColorV3.value, inputColorV4.value];
      for (let i = 1; i <= 4; i++) {
        const ang = diffAng - 72 * i;
        const normAng = ((ang % 360) + 360) % 360;
        const rad = degToRad(ang);
        const ex = cx + diffLen * Math.cos(rad) * scale;
        const ey = cy - diffLen * Math.sin(rad) * scale;
        allV.push({ ang: normAng, ex, ey, color: vColors[i], label: `V${i}` });
        drawArrowOnly(cx, cy, ex, ey, vColors[i], `V${i}`, 3);
      }

      // 按角度排序
      allV.sort((p, q) => p.ang - q.ang);

      // 找到反向第一次落在哪两个 V 向量之间
      const negAngNorm = ((negAng % 360) + 360) % 360;
      let pair = [allV[allV.length - 1], allV[0]]; // 默认最后一根和第一根
      for (let i = 0; i < allV.length - 1; i++) {
        if (negAngNorm >= allV[i].ang && negAngNorm <= allV[i + 1].ang) {
          pair = [allV[i], allV[i + 1]];
          break;
        }
      }

      // 矢量分解：将反向第一次向量分解到周围两个V向量方向上（力的分解）
      const projLengths = [];
      const Px = negX - cx;
      const Py = negY - cy;

      const [v1, v2] = pair;
      const dx1 = v1.ex - cx, dy1 = v1.ey - cy;
      const dx2 = v2.ex - cx, dy2 = v2.ey - cy;
      const len1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
      const len2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);

      // 单位方向向量
      const ux = dx1 / len1, uy = dy1 / len1;
      const vx = dx2 / len2, vy = dy2 / len2;

      // Cramer's rule: 解 P = k1·U + k2·V（像素空间）
      const det = ux * vy - uy * vx;
      const k1_px = (Px * vy - Py * vx) / det;
      const k2_px = (ux * Py - uy * Px) / det;

      // 转换到 IPs
      const k1 = k1_px / scale;
      const k2 = k2_px / scale;

      // 同时计算投影值用于角度计算（角度 = acos(proj / |P|)）
      const proj1 = (Px * dx1 + Py * dy1) / len1 / scale;
      const proj2 = (Px * dx2 + Py * dy2) / len2 / scale;

      projLengths.push({ label: v1.label, val: k1, proj: proj1 });
      projLengths.push({ label: v2.label, val: k2, proj: proj2 });

      // 绘制两个分量向量
      const comp1EndX = cx + k1_px * ux;
      const comp1EndY = cy + k1_px * uy;
      const comp2EndX = cx + k2_px * vx;
      const comp2EndY = cy + k2_px * vy;

      // 分量向量的统一颜色
      const compColor = '#9b59b6';

      drawArrowOnly(cx, cy, comp1EndX, comp1EndY, compColor, null, 2.5);
      drawArrowOnly(cx, cy, comp2EndX, comp2EndY, compColor, null, 2.5);

      // 补全平行四边形（虚线）
      ctx.strokeStyle = compColor;
      ctx.lineWidth = 1.5 * dpr;
      ctx.setLineDash([4 * dpr, 4 * dpr]);
      ctx.beginPath();
      ctx.moveTo(comp1EndX, comp1EndY);
      ctx.lineTo(negX, negY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(comp2EndX, comp2EndY);
      ctx.lineTo(negX, negY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 文字标注统一在最上层绘制
      for (const l of labels) {
        drawLabel(l.text, l.x, l.y, l.color, l.fontPx, l.bold);
      }

      // 更新信息栏
      const gramsB = parseFloat(inputGramsB.value) || 0;
      const gMul = diffLen > 0 ? gramsB / diffLen : 0;
      let infoHTML = `<table class="info-table"><tr>`;
      for (const p of projLengths) {
        infoHTML += `<td>分解 反向第一次→<span class="vl">${p.label}</span>: <b>${(p.val * gMul).toFixed(1)} g</b></td>`;
      }
      infoHTML += `</tr><tr>`;
      for (const p of projLengths) {
        const ang = Math.acos(Math.max(-1, Math.min(1, p.proj / valA))) * 180 / Math.PI;
        infoHTML += `<td>夹角 反向第一次→<span class="vl">${p.label}</span>: <b>${ang.toFixed(1)}°</b></td>`;
      }
      infoHTML += `</tr></table>`;
      document.getElementById('infoBar').innerHTML = infoHTML;

      // 存下计算数据给弹框用
      window._calcData = {
        valA, angA,
        valB: parseFloat(inputValB.value) || 0,
        angB: parseFloat(inputAngB.value) || 0,
        gramsB,
        diffLen, diffAng: ((diffAng % 360) + 360) % 360,
        negAng, negAngNorm,
        v1Label: v1.label, v1Ang: v1.ang,
        v2Label: v2.label, v2Ang: v2.ang,
        k1, k2, proj1, proj2, gMul,
        allV: allV
      };
    }

    function drawLabel(text, x, y, color, fontPx, bold) {
      const fs = fontPx * dpr;
      ctx.font = `${bold ? 'bold ' : ''}${fs}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const w = ctx.measureText(text).width;
      const h = fs * 1.2;
      const padX = 5 * dpr;
      const padY = 3 * dpr;
      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      ctx.fillRect(x - w / 2 - padX, y - h / 2 - padY, w + 2 * padX, h + 2 * padY);
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
    }

    function getEndpoint(valStr, angStr, scale, cx, cy) {
      const val = parseFloat(valStr) || 0;
      const ang = parseFloat(angStr) || 0;
      const rad = degToRad(ang);
      return {
        x: cx + val * Math.cos(rad) * scale,
        y: cy - val * Math.sin(rad) * scale
      };
    }

    function drawVector(sx, sy, ex, ey, color, label, val, ang, lw) {
      // 画线
      ctx.strokeStyle = color;
      ctx.lineWidth = (lw || 2.5) * dpr;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      // 箭头
      const arrowLen = 12 * dpr;
      const arrowAngle = degToRad(25);
      const baseAngle = Math.atan2(ey - sy, ex - sx);

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(
        ex - arrowLen * Math.cos(baseAngle - arrowAngle),
        ey - arrowLen * Math.sin(baseAngle - arrowAngle)
      );
      ctx.lineTo(
        ex - arrowLen * Math.cos(baseAngle + arrowAngle),
        ey - arrowLen * Math.sin(baseAngle + arrowAngle)
      );
      ctx.closePath();
      ctx.fill();

      // 标签
      const labelDist = 16 * dpr;
      const lx = ex + labelDist * Math.cos(baseAngle);
      const ly = ey + labelDist * Math.sin(baseAngle);
      labels.push({ text: label, x: lx, y: ly, color: color, fontPx: 13, bold: true });

      // 数值标注（画在向量中间偏上）
      const midX = (sx + ex) * 0.5;
      const midY = (sy + ey) * 0.5;
      const tagX = -10 * dpr * Math.sin(baseAngle);
      const tagY = -10 * dpr * Math.cos(baseAngle);
      const angNorm = ((ang % 360) + 360) % 360;
      labels.push({ text: `|${label}|=${val.toFixed(1)} IPs  ${angNorm.toFixed(1)}°`, x: midX + tagX, y: midY + tagY, color: '#666', fontPx: 10, bold: false });
    }

    function drawArrowOnly(sx, sy, ex, ey, color, label, lw) {
      ctx.strokeStyle = color;
      ctx.lineWidth = (lw || 2) * dpr;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      const arrowLen = 10 * dpr;
      const arrowAngle = degToRad(25);
      const baseAngle = Math.atan2(ey - sy, ex - sx);

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(
        ex - arrowLen * Math.cos(baseAngle - arrowAngle),
        ey - arrowLen * Math.sin(baseAngle - arrowAngle)
      );
      ctx.lineTo(
        ex - arrowLen * Math.cos(baseAngle + arrowAngle),
        ey - arrowLen * Math.sin(baseAngle + arrowAngle)
      );
      ctx.closePath();
      ctx.fill();

      if (label) {
        const labelDist = 16 * dpr;
        const lx = ex + labelDist * Math.cos(baseAngle);
        const ly = ey + labelDist * Math.sin(baseAngle);
        labels.push({ text: label, x: lx, y: ly, color: color, fontPx: 12, bold: true });
      }
    }

    function showCalc() {
      const d = window._calcData;
      if (!d) return;
      const steps = [
        { t: '输入',
          v: `第一次：大小 ${d.valA} IPs，方向 ${d.angA}°<br>第二次：大小 ${d.valB} IPs，方向 ${d.angB}°<br>克数 = ${d.gramsB}` },
        { t: '1. V = 第二次 − 第一次',
          v: `V 长度 = ${d.diffLen.toFixed(2)} IPs，V 方向 = ${d.diffAng.toFixed(1)}°` },
        { t: '2. 反向第一次 P',
          v: `方向 = ${d.negAng.toFixed(1)}°，大小 = ${d.valA} IPs` },
        { t: '3. V1 ~ V4',
          v: d.allV.filter(x => x.label !== 'V').map(x => `${x.label} = ${x.ang.toFixed(1)}°`).join('，') },
        { t: '4. P 挨着哪两根',
          v: `P 方向 = ${d.negAngNorm.toFixed(1)}°，落在 ${d.v1Label}(${d.v1Ang.toFixed(1)}°) 和 ${d.v2Label}(${d.v2Ang.toFixed(1)}°) 之间` },
        { t: '5. 力的分解',
          v: `沿 ${d.v1Label}：${d.k1.toFixed(3)} IPs<br>沿 ${d.v2Label}：${d.k2.toFixed(3)} IPs` },
        { t: '6. 夹角',
          v: `P → ${d.v1Label}：${(Math.acos(Math.max(-1,Math.min(1,d.proj1/d.valA)))*180/Math.PI).toFixed(1)}°<br>P → ${d.v2Label}：${(Math.acos(Math.max(-1,Math.min(1,d.proj2/d.valA)))*180/Math.PI).toFixed(1)}°` },
        { t: '7. 克数换算',
          v: `每份 = ${d.gramsB} / ${d.diffLen.toFixed(2)} = ${d.gMul.toFixed(1)}<br>${d.v1Label}：${d.k1.toFixed(3)} × ${d.gMul.toFixed(1)} = ${(d.k1*d.gMul).toFixed(1)} g<br>${d.v2Label}：${d.k2.toFixed(3)} × ${d.gMul.toFixed(1)} = ${(d.k2*d.gMul).toFixed(1)} g` }
      ];
      document.getElementById('modalContent').innerHTML = steps.map(s =>
        `<div class="step"><div class="step-title">${s.t}</div><div class="step-val">${s.v}</div></div>`
      ).join('');
      document.getElementById('modalOverlay').classList.add('show');
    }

    function closeCalc(e) {
      if (e && e.target !== document.getElementById('modalOverlay')) return;
      document.getElementById('modalOverlay').classList.remove('show');
    }

    function showSettings() {
      document.getElementById('settingsOverlay').classList.add('show');
    }

    function closeSettings(e) {
      if (e && e.target !== document.getElementById('settingsOverlay')) return;
      document.getElementById('settingsOverlay').classList.remove('show');
    }

    window.addEventListener('resize', resize);

    const allInputs = [inputValA, inputAngA, inputValB, inputAngB, inputGramsB, inputColorV, inputColorV1, inputColorV2, inputColorV3, inputColorV4, inputRangeMax];

    // 从 localStorage 恢复所有值
    allInputs.forEach(el => {
      const saved = localStorage.getItem('vec-' + el.id);
      if (saved) el.value = saved;
    });

    allInputs.forEach(el => {
      el.addEventListener('input', () => {
        // valA / valB 不允许负数
        if ((el.id === 'valA' || el.id === 'valB') && parseFloat(el.value) < 0) {
          el.value = '0';
        }
        localStorage.setItem('vec-' + el.id, el.value);
        draw();
      });
    });

    // 视图变换辅助函数与手势交互
    function resetView() {
      offsetX = 0; offsetY = 0; zoom = 1;
      draw();
    }

    function clampZoom(z) {
      return Math.min(10, Math.max(0.1, z));
    }

    function zoomAt(factor, x, y) {
      const oldZoom = zoom;
      const newZoom = clampZoom(oldZoom * factor);
      const realFactor = newZoom / oldZoom;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const px = x - centerX - offsetX;
      const py = y - centerY - offsetY;
      offsetX += px * (1 - realFactor);
      offsetY += py * (1 - realFactor);
      zoom = newZoom;
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    const pointers = new Map();
    let dragState = null;   // { x, y, ox, oy }
    let pinchState = null;  // { lastDist }

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      const p = { x: e.offsetX * dpr, y: e.offsetY * dpr };
      pointers.set(e.pointerId, p);
      if (pointers.size === 1) {
        dragState = { x: p.x, y: p.y, ox: offsetX, oy: offsetY };
      } else if (pointers.size === 2) {
        dragState = null;
        const [p1, p2] = [...pointers.values()];
        pinchState = { lastDist: dist(p1, p2) };
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      const p = { x: e.offsetX * dpr, y: e.offsetY * dpr };
      pointers.set(e.pointerId, p);
      if (pointers.size === 1 && dragState) {
        offsetX = dragState.ox + (p.x - dragState.x);
        offsetY = dragState.oy + (p.y - dragState.y);
        draw();
      } else if (pointers.size === 2 && pinchState) {
        const [p1, p2] = [...pointers.values()];
        const d = dist(p1, p2);
        const factor = d / pinchState.lastDist;
        pinchState.lastDist = d;
        zoomAt(factor, (p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
        draw();
      }
    });

    function endPointer(e) {
      pointers.delete(e.pointerId);
      if (pointers.size === 1) {
        const [p] = [...pointers.values()];
        dragState = { x: p.x, y: p.y, ox: offsetX, oy: offsetY };
        pinchState = null;
      } else if (pointers.size === 0) {
        dragState = null;
        pinchState = null;
      }
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoomAt(Math.exp(-e.deltaY * 0.0015), e.offsetX * dpr, e.offsetY * dpr);
      draw();
    }, { passive: false });

    canvas.addEventListener('dblclick', resetView);

    resize();
  </script>
</body>
</html>
