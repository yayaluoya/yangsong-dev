<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>向量画板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div class="info-bar" id="infoBar"></div>

  <div class="controls">
    <div class="group">
      <div class="group-title">
        <span class="dot" style="background:#e74c3c;"></span> 第一次
      </div>
      <div class="row">
        <div class="field">
          <label>振动 (IPs)</label>
          <input type="number" id="valA" value="0.5" step="0.01" min="0">
        </div>
        <div class="field">
          <label>角度 (0~360°)</label>
          <input type="number" id="angA" value="90" step="0.1" min="0" max="360">
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-title">
        <span class="dot" style="background:#2ecc71;"></span> 第二次
      </div>
      <div class="row">
        <div class="field">
          <label>振动 (IPs)</label>
          <input type="number" id="valB" value="0.7" step="0.01" min="0">
        </div>
        <div class="field">
          <label>角度 (0~360°)</label>
          <input type="number" id="angB" value="120" step="0.1" min="0" max="360">
        </div>
        <div class="field">
          <label>克数</label>
          <input type="number" id="gramsB" value="0" step="1" min="0">
        </div>
        <div class="field">
          <label>增减</label>
          <select id="gramsMode">
            <option value="add">增重</option>
            <option value="remove">减重</option>
          </select>
        </div>
      </div>
    </div>

    <div class="row">
      <button class="btn-calc" onclick="resetView()">重置视图</button>
      <button class="btn-calc" onclick="showCalc()">查看计算过程</button>
      <button class="btn-calc" onclick="showSettings()">设置</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeCalc(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>计算过程 <button class="modal-close" onclick="closeCalc()">✕</button></h3>
      <div class="modal-body"><div id="modalContent"></div></div>
    </div>
  </div>

  <div class="modal-overlay" id="settingsOverlay" onclick="closeSettings(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>设置 <button class="modal-close" onclick="closeSettings()">✕</button></h3>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:10px;">
        <div class="group">
          <div class="group-title">
            <span class="dot" style="background:#f39c12;"></span> 桨叶组名字和颜色
          </div>
          <div class="row">
            <div class="field"><label>桨叶1</label><input type="text" id="nameV" value="桨叶1"><input type="color" id="colorV" value="#f39c12"></div>
            <div class="field"><label>桨叶2</label><input type="text" id="nameV1" value="桨叶2"><input type="color" id="colorV1" value="#fad7a0"></div>
            <div class="field"><label>桨叶3</label><input type="text" id="nameV2" value="桨叶3"><input type="color" id="colorV2" value="#fad7a0"></div>
            <div class="field"><label>桨叶4</label><input type="text" id="nameV3" value="桨叶4"><input type="color" id="colorV3" value="#f39c12"></div>
            <div class="field"><label>桨叶5</label><input type="text" id="nameV4" value="桨叶5"><input type="color" id="colorV4" value="#f39c12"></div>
          </div>
        </div>

        <div style="text-align:center;font-size:10px;color:#ccc;padding-top:4px;">v1.6.0</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
